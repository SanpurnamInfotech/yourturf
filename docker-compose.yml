services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: turf_backend

    env_file:
      - ./backend/.env

    ports:
      - "127.0.0.1:8010:8000"

    volumes:
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: turf_frontend

    ports:
      - "127.0.0.1:3010:80"

    restart: unless-stopped